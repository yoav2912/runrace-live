# Render Blueprint — deploy backend + Postgres for remote testing
# Docs: docs/REMOTE-TEST-HE.md

databases:
  - name: runrace-db
    plan: free
    databaseName: runrace_live
    user: runrace

services:
  - type: web
    name: runrace-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w @runrace/shared && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: runrace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 120
